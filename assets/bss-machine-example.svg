<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Example BSS machine diagram</title>
  <desc id="desc">A sample Blum-Shub-Smale machine with an input node, computation node, branch node, an additional computation node, and an output node.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3c88"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="24" fill="#f8fafc"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">Example BSS Machine</text>
    <text x="40" y="72" font-size="16" fill="#334155">An illustrative finite-dimensional BSS machine with one branch and two possible paths.</text>

    <g filter="url(#shadow)">
      <rect x="48" y="140" width="130" height="72" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
      <text x="113" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Input</text>
      <text x="113" y="193" text-anchor="middle" font-size="15" fill="#1e3a8a">1</text>
      <text x="113" y="214" text-anchor="middle" font-size="13" fill="#1e3a8a">L(x)</text>

      <rect x="240" y="140" width="170" height="72" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="325" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Computation</text>
      <text x="325" y="193" text-anchor="middle" font-size="15" fill="#166534">2</text>
      <text x="325" y="214" text-anchor="middle" font-size="13" fill="#166534">g(x) = (x₁ + x₂, x₂)</text>

      <rect x="474" y="132" width="160" height="88" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="554" y="162" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">Branch</text>
      <text x="554" y="185" text-anchor="middle" font-size="15" fill="#92400e">3</text>
      <text x="554" y="208" text-anchor="middle" font-size="13" fill="#92400e">h(x) = x₁</text>

      <rect x="714" y="56" width="172" height="72" rx="18" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
      <text x="800" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">Output</text>
      <text x="800" y="109" text-anchor="middle" font-size="15" fill="#3730a3">4</text>
      <text x="800" y="130" text-anchor="middle" font-size="13" fill="#3730a3">O(x) = x₁</text>

      <rect x="714" y="256" width="172" height="72" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="800" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Computation</text>
      <text x="800" y="309" text-anchor="middle" font-size="15" fill="#991b1b">5</text>
      <text x="800" y="330" text-anchor="middle" font-size="13" fill="#991b1b">g(x) = (-x₁, x₂)</text>
    </g>

    <path d="M178 176 H240" stroke="#1f3c88" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M410 176 H474" stroke="#1f3c88" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M634 154 C 674 154, 678 92, 714 92" stroke="#1f3c88" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M634 198 C 674 198, 678 292, 714 292" stroke="#1f3c88" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M800 256 L800 128" stroke="#1f3c88" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="676" y="116" font-size="14" font-weight="700" fill="#1f3c88">h(x) ≥ 0</text>
    <text x="677" y="245" font-size="14" font-weight="700" fill="#1f3c88">h(x) &lt; 0</text>
  </g>
</svg>
